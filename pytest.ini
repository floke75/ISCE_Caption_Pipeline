[pytest]
pythonpath = .
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*torchaudio._backend.list_audio_backends.*:UserWarning
    ignore:.*torchaudio.load_with_torchcodec.*:UserWarning
    ignore:.*torio.io._streaming_media_decoder.StreamingMediaDecoder.*:UserWarning
norecursedirs = ui/frontend/node_modules ui/frontend/dist ui/frontend/.next ui/node_modules pipeline_data _intermediate _output ui_data
